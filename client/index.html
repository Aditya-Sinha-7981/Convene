<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Convene — Join meeting</title>
<link rel="stylesheet" href="/static/join.css"></head>
<body>
<main class="join-page"><div class="join-ambient" aria-hidden="true"></div><section class="join-card">
<header><p class="join-kicker">Local meeting intelligence</p><h1>CONVENE</h1><p class="join-intro">A room where every voice keeps its place.</p></header>
<div class="join-form"><label for="name">Your name</label><input id="name" maxlength="80" autocomplete="name" placeholder="e.g. Priya"><button id="start">Join and start microphone</button><button id="stop" disabled>Stop microphone</button><button id="retry" hidden>Try again</button></div>
<p id="consent">This session's audio is being transcribed. Keep this page open while you speak.</p>
<div class="join-status"><span class="status-orb" aria-hidden="true"></span><p>Connection: <span id="status">idle</span></p></div><p id="detail" role="status"></p>
</section></main>
<script src="/static/app.js"></script></body></html>
