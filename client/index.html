<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f5f0">
<title>Convene — Join meeting</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/join.css"></head>
<body>
<header class="join-bar">
  <span class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#4338ca"/><rect x="8" y="12" width="3.5" height="8" rx="1.75" fill="#fff"/><rect x="14.25" y="7.5" width="3.5" height="17" rx="1.75" fill="#fff"/><rect x="20.5" y="10.5" width="3.5" height="11" rx="1.75" fill="#fff"/></svg>Convene</span>
  <div class="join-status" data-state="idle"><span class="status-orb" aria-hidden="true"></span><p>Connection: <span id="status">idle</span></p></div>
</header>
<main class="join-page"><section class="join-card">
<header><p class="join-kicker">You're joining a meeting</p><h1>Your phone is your microphone</h1><p class="join-intro">Convene transcribes what you say on the laptop in this room. Nothing goes to the internet.</p></header>
<figure class="mascot join-mascot" data-mascot data-mood="waiting"><div class="mascot-art"></div><figcaption class="mascot-line" aria-live="polite">Hi! Add your name and I'll start listening.</figcaption></figure>
<div class="join-form"><label for="name">Your name</label><input id="name" class="field" maxlength="80" autocomplete="name" placeholder="e.g. Priya"><button id="start" class="btn btn-primary">Join and start microphone</button><button id="stop" class="btn btn-secondary" disabled>Stop microphone</button><button id="retry" class="btn btn-secondary" hidden>Try again</button></div>
<p id="consent">This session's audio is being transcribed. Keep this page open while you speak.</p>
<p id="detail" role="status"></p>
</section></main>
<script src="/static/app.js"></script>
<script src="/static/mascot.js"></script>
<script src="/static/join_ui.js"></script></body></html>
